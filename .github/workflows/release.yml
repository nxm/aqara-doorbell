name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" ./macos/make-app.sh

      - name: Package zip and dmg
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist staging
          ditto -c -k --keepParent macos/AqaraDoorbell.app "dist/AqaraDoorbell-$V.zip"
          cp -R macos/AqaraDoorbell.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Aqara Doorbell" -srcfolder staging -ov -format UDZO "dist/AqaraDoorbell-$V.dmg"
          (cd dist && shasum -a 256 ./* > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      # Needs a HOMEBREW_TAP_TOKEN secret (fine-grained PAT with contents:write
      # on nxm/homebrew-tap). Without it the cask is bumped by hand.
      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then echo "HOMEBREW_TAP_TOKEN not set; skipping"; exit 0; fi
          V="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "dist/AqaraDoorbell-$V.zip" | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/nxm/homebrew-tap.git" tap
          sed -i '' -e "s/^  version \".*\"/  version \"$V\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" tap/Casks/aqara-doorbell.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "aqara-doorbell $V"
          git push
