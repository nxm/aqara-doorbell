name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path macos
      - name: Build universal app
        run: ./macos/make-app.sh

  notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Flake check
        run: nix flake check
      - name: Build notifier
        run: nix build .#notifier
